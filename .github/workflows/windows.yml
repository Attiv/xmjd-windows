name: Windows build and installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build x64 and x86; run native CTest
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "C:\Program Files\7-Zip;$env:PATH"
          & .\Windows\scripts\build.ps1
      - name: Build directly installable EXE
        run: |
          $ErrorActionPreference = 'Stop'
          & .\Windows\scripts\package-installer.ps1
      - name: Test real installer and uninstaller
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem .\Windows\out\release\*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected one installer.' }
          $env:XMJD_REGISTRATION_TRACE = Join-Path $PWD 'Windows/out/installer-tests/registration-trace.log'
          try {
            & .\Windows\ci\test-installer.ps1 -InstallerPath $installer[0].FullName
          } finally {
            if (Test-Path -LiteralPath $env:XMJD_REGISTRATION_TRACE) {
              Get-Content -LiteralPath $env:XMJD_REGISTRATION_TRACE -Encoding Unicode
            }
          }
      - name: Collect corresponding third-party sources
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.longpaths true
          & .\Windows\scripts\package-sources.ps1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $sourceZip = @(Get-ChildItem .\Windows\out\release\*-sources.zip)
          if ($sourceZip.Count -ne 1) { throw 'Expected one corresponding-source ZIP.' }
          $checkRoot = Join-Path $PWD 'Windows/out/source-check'
          [IO.Compression.ZipFile]::ExtractToDirectory($sourceZip[0].FullName, $checkRoot)
          $expand = @(Get-ChildItem -LiteralPath $checkRoot -Filter Expand-Sources.ps1 -Recurse)
          if ($expand.Count -ne 1) { throw 'Expected one offline source expander.' }
          $expanded = Join-Path $PWD 'Windows/out/expanded-sources'
          & $expand[0].FullName -Destination $expanded
          foreach ($required in @('librime/CMakeLists.txt', 'librime/plugins/lua/CMakeLists.txt',
              'librime/plugins/octagram/CMakeLists.txt', 'rime-essay/essay.txt',
              'lua-5.4.8/src/lua.c', 'boost_1_89_0/boost/version.hpp')) {
            if (-not (Test-Path -LiteralPath (Join-Path $expanded $required) -PathType Leaf)) {
              throw "Offline source expansion is incomplete: $required"
            }
          }
          Write-Output 'PASS: complete corresponding sources expanded offline on Windows.'
      - name: Assemble release hashes and project source
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = Join-Path $PWD 'Windows/out/release'
          git archive --format=zip --output="$releaseRoot/XMJD-0.1.2+3-project-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Project source archive failed.' }
          $lines = @(Get-ChildItem -LiteralPath $releaseRoot -File | Sort-Object Name | ForEach-Object {
            (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name
          })
          [IO.File]::WriteAllLines((Join-Path $releaseRoot 'SHA256SUMS.txt'), $lines, [Text.UTF8Encoding]::new($false))
      - name: Collect engine diagnostic logs
        if: always()
        run: |
          $logs = Join-Path $env:LOCALAPPDATA 'XMJD/Logs'
          if (Test-Path -LiteralPath $logs) {
            $destination = 'Windows/out/engine-logs'
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            Copy-Item -Path "$logs/*" -Destination $destination -Recurse -Force
          }
      - name: Preserve packages and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-build-results
          path: |
            Windows/out/package/*.zip
            Windows/out/release/*
            Windows/out/installer-tests/*
            Windows/out/build/**/Testing/Temporary/*.log
            Windows/out/engine-logs/*
          if-no-files-found: warn
          retention-days: 14
