name: Windows build and installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build x64 and x86; run native CTest
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "C:\Program Files\7-Zip;$env:PATH"
          & .\Windows\scripts\build.ps1
      - name: Build directly installable EXE
        run: |
          $ErrorActionPreference = 'Stop'
          & .\Windows\scripts\package-installer.ps1
      - name: Test real installer and uninstaller
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem .\Windows\out\release\*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected one installer.' }
          & .\Windows\ci\test-installer.ps1 -InstallerPath $installer[0].FullName
      - name: Preserve packages and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-build-results
          path: |
            Windows/out/package/*.zip
            Windows/out/release/*
            Windows/out/installer-tests/*
            Windows/out/build/**/Testing/Temporary/*.log
          if-no-files-found: warn
          retention-days: 14
